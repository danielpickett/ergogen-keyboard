CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Use Zephyr's minimal libc; no heap-heavy libc features are needed by this keyboard.
CONFIG_MINIMAL_LIBC=y
# Improves BLE connection negotiation with hosts that reject the default path.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Avoid external 32 kHz crystal instability during BLE pairing on nRF52840.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
